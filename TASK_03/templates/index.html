<!DOCTYPE html>
<html>
<head>
    <title>Student Result Prediction</title>
</head>
<body>
    <h2>Enter Student Details</h2>
    <form action="/predict" method="post">
        <input type="text" name="hours" placeholder="Study Hours"><br><br>
        <input type="text" name="attendance" placeholder="Attendance %"><br><br>
        <input type="text" name="previous_marks" placeholder="Previous Marks"><br><br>
        <button type="submit">Predict</button>
    </form>

    <h3>{{ prediction_text }}</h3>
</body>
</html>
